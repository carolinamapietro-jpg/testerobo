<text x="655" y="615" fill="#3fb950" font-size="13" font-weight="bold">Take Profit (TP) automático  — RR 2:1</text>
<text x="655" y="630" fill="#8b949e" font-size="11">TP = Entrada ± 2.0 × Risco.  Break-even mínimo = 33.33%.</text>

<text x="655" y="652" fill="#58a6ff" font-size="13" font-weight="bold">Break-Even automático</text>
<text x="655" y="667" fill="#8b949e" font-size="11">Lucro ≥ 1.5×ATR → SL move para o preço de entrada (risco zero)</text>

<text x="655" y="689" fill="#d29922" font-size="13" font-weight="bold">Saída Dinâmica  (MinRR = 2.0, raramente dispara)</text>
<text x="655" y="704" fill="#8b949e" font-size="11">Após 15 barras, se lucro ≥ 2×risco E estrutura oposta rompida.</text>
<text x="655" y="718" fill="#8b949e" font-size="11">Como MinRR=RR=2.0, o TP bate antes → saída dinâmica inativa na prática.</text>
